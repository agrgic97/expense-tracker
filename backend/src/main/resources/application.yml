spring:
  application:
    name: expense-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expenses}
    username: ${DB_USER:expenses}
    password: ${DB_PASSWORD:expenses}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  auth:
    # HMAC key for signing JWTs (min. 32 characters). If empty, a random key is generated at startup.
    jwt-secret: ${JWT_SECRET:}
    token-validity: ${JWT_EXPIRATION:7d}
    registration-enabled: ${REGISTRATION_ENABLED:true}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
