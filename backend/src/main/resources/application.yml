spring:
  application:
    name: expense-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expenses}
    username: ${DB_USER:expenses}
    password: ${DB_PASSWORD:expenses}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      # Bank statements as PDF; several can be uploaded at once
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  # Without MAIL_HOST no mails are sent and password reset is unavailable
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000

app:
  # Public address of the app, used for links in mails
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  recurring:
    # Daily job that books due recurring entries (server time zone)
    cron: "0 5 0 * * *"
  auth:
    # HMAC key for signing JWTs (min. 32 characters). If empty, a random key is generated at startup.
    jwt-secret: ${JWT_SECRET:}
    access-token-validity: ${ACCESS_TOKEN_VALIDITY:15m}
    refresh-token-validity: ${REFRESH_TOKEN_VALIDITY:30d}
    # Must be true when the app is served over HTTPS
    cookie-secure: ${COOKIE_SECURE:false}
    registration-enabled: ${REGISTRATION_ENABLED:true}
    password-reset-validity: ${PASSWORD_RESET_VALIDITY:1h}
    rate-limit:
      window: ${LOGIN_RATE_LIMIT_WINDOW:15m}
      max-failures-per-user-and-ip: 5
      max-failures-per-user: 20
      max-attempts-per-ip: 30

server:
  port: 8080
  shutdown: graceful
  # Trust X-Forwarded-For from the nginx container so rate limiting sees the real client IP
  forward-headers-strategy: native

management:
  health:
    # An unreachable mail server must not mark the app as unhealthy
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
